<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#132a24">
  <meta name="description" content="BAAR quick budget entry">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>Baa₹ Quick Entry</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">BAAR</p>
        <h1>Quick entry</h1>
      </div>
      <button class="icon-button" id="settingsButton" aria-label="Open settings">⚙</button>
    </header>

    <section class="balance-panel" aria-live="polite">
      <p>Total money left</p>
      <strong id="balance">₹0.00</strong>
      <div class="balance-row">
        <span>Income <b id="income">₹0.00</b></span>
        <span>Spent <b id="spent">₹0.00</b></span>
      </div>
    </section>

    <nav class="type-tabs" aria-label="Transaction type">
      <button class="type-tab active" data-kind="expense">Expense</button>
      <button class="type-tab" data-kind="income">Income</button>
      <button class="type-tab" data-kind="investment">Invest</button>
    </nav>

    <form id="transactionForm" class="entry-form">
      <label>Amount
        <div class="amount-input"><span>₹</span><input id="amount" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required></div>
      </label>
      <label>Date <input id="transactionDate" type="date" required></label>
      <label>Category
        <select id="category" required></select>
      </label>
      <label id="investmentTypeRow" class="hidden">Investment type
        <select id="investmentType"><option>Stocks</option><option>ETF</option><option>Mutual funds</option><option>Bonds</option><option>Other</option></select>
      </label>
      <label>Note <input id="note" type="text" maxlength="120" placeholder="Optional"></label>
      <button class="save-button" type="submit">Save transaction</button>
      <p id="formMessage" class="form-message" role="status"></p>
    </form>

    <section class="recent-section">
      <div class="section-heading"><h2>Recent activity</h2><button id="refreshButton" class="text-button">Refresh</button></div>
      <div id="recentList" class="recent-list"><p class="empty-state">Connect your database in settings to see records.</p></div>
    </section>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog" id="settingsForm" class="settings-form">
      <div class="section-heading"><h2>Database connection</h2><button class="icon-button" value="cancel" aria-label="Close settings">×</button></div>
      <p class="helper">Use your Supabase project URL and public anon key. Never use the service-role key here.</p>
      <label>Supabase URL <input id="supabaseUrl" type="url" placeholder="https://your-project.supabase.co" required></label>
      <label>Anon key <input id="supabaseKey" type="password" placeholder="eyJ..." required></label>
      <button class="save-button" value="default">Save connection</button>
      <button id="clearSettings" class="danger-button" type="button">Clear saved connection</button>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
